<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patient Registration</title>
  <link rel="stylesheet" href="sharedstyle.css" />
  <link rel="stylesheet" href="form.css" />
</head>

<body class="bg-light">
  <header class="bg-success text-white text-center py-4">
    <h1 class="h2 mb-0">Patient Registration</h1>
  </header>
  <nav class="navbar navbar-dark bg-dark justify-content-center">
    <a href="index.html">Home</a><a href="patient-report.html">Report</a><a href="media.html">Media</a>
  </nav>
  <main class="container py-4">
   <form id="patientForm" class="card shadow-sm mx-auto" style="max-width: 700px" action="#" method="get">

      <fieldset class="card-body border-0">
        <legend class="h3">Patient Details</legend>
        <label for="name">Patient Name</label><input class="form-control" id="name" name="name" required /><label
          for="age">Age</label><input id="age" name="age" type="number" min="0" max="120" class="form-control"
          required /><label for="gender">Gender</label><select class="form-select" id="gender" name="gender">
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
          <option>Prefer not to say</option>
        </select><label for="mobile">Mobile Number</label><input id="mobile" name="mobile" type="tel"
          pattern="[0-9]{10}" placeholder="10-digit number" class="form-control" required /><label
          for="email">Email</label><input class="form-control" id="email" name="email" type="email" required /><label
          for="patient-id">Patient ID</label><input class="form-control" id="patient-id" name="patient-id"
          required /><label for="test-date">Test Date</label><input class="form-control" id="test-date" name="test-date"
          type="date" required /><label for="doctor">Doctor Name</label><input class="form-control" id="doctor"
          name="doctor" /><label class="mt-3">Symptoms</label><label class="inline"><input type="checkbox"
            name="symptom" value="burning" /> Burning
          sensation</label><label class="inline"><input type="checkbox" name="symptom" value="fever" />
          Fever</label><label class="inline"><input type="checkbox" name="symptom" value="pain" /> Abdominal
          pain</label><label>Preferred Report Format</label><label class="inline"><input type="radio" name="format"
            value="pdf" checked /> PDF</label><label class="inline"><input type="radio" name="format" value="print" />
          Printed
          copy</label><br /><button class="btn btn-success mt-3" type="submit">Submit</button><button
          class="btn btn-outline-secondary mt-3" type="reset">Reset</button>
      </fieldset>
    </form>
  </main>
  <footer class="bg-dark text-white text-center py-3">Somaiya Care Hospital</footer>
<script>
document.getElementById("patientForm").addEventListener("submit", function(event) {

  
    let name = document.getElementById("name").value.trim();
    let age = document.getElementById("age").value;
    let mobile = document.getElementById("mobile").value.trim();
    let email = document.getElementById("email").value.trim();
    let patientId = document.getElementById("patient-id").value.trim();
    let testDate = document.getElementById("test-date").value;
    let doctor = document.getElementById("doctor").value.trim();

    
    if (name === "") {
        alert("Please enter the patient's name.");
        event.preventDefault();
        return;
    }

   
    let namePattern = /^[A-Za-z ]+$/;

    if (!namePattern.test(name)) {
        alert("Patient name should contain only letters and spaces.");
        event.preventDefault();
        return;
    }

  
    if (age === "" || age < 0 || age > 120) {
        alert("Age must be between 0 and 120.");
        event.preventDefault();
        return;
    }

    
    let mobilePattern = /^[0-9]{10}$/;

    if (!mobilePattern.test(mobile)) {
        alert("Mobile number must contain exactly 10 digits.");
        event.preventDefault();
        return;
    }

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email address.");
        event.preventDefault();
        return;
    }

    
    if (patientId === "") {
        alert("Please enter the Patient ID.");
        event.preventDefault();
        return;
    }

    if (testDate === "") {
        alert("Please select the test date.");
        event.preventDefault();
        return;
    }

   
    if (doctor !== "" && !namePattern.test(doctor)) {
        alert("Doctor name should contain only letters and spaces.");
        event.preventDefault();
        return;
    }

    let symptoms = document.querySelectorAll('input[name="symptom"]:checked');

    if (symptoms.length === 0) {
        alert("Please select at least one symptom.");
        event.preventDefault();
        return;
    }

   
    alert("Patient registration submitted successfully!");
});
</script>
</body>

</html>
