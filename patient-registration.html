<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Patient Registration</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header><h1>Patient Registration</h1></header>
    <nav>
      <a href="index.html">Home</a><a href="patient-report.html">Report</a
      ><a href="media.html">Media</a>
    </nav>
    <main>
      <form action="#" method="get">
        <label for="name">Patient Name</label
        ><input id="name" name="name" required /><label for="age">Age</label
        ><input
          id="age"
          name="age"
          type="number"
          min="0"
          max="120"
          required
        /><label for="gender">Gender</label
        ><select id="gender" name="gender">
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
          <option>Prefer not to say</option></select
        ><label for="mobile">Mobile Number</label
        ><input
          id="mobile"
          name="mobile"
          type="tel"
          pattern="[0-9]{10}"
          placeholder="10-digit number"
          required
        /><label for="email">Email</label
        ><input id="email" name="email" type="email" required /><label
          for="patient-id"
          >Patient ID</label
        ><input id="patient-id" name="patient-id" required /><label
          for="test-date"
          >Test Date</label
        ><input id="test-date" name="test-date" type="date" required /><label
          for="doctor"
          >Doctor Name</label
        ><input id="doctor" name="doctor" /><label>Symptoms</label
        ><label class="inline"
          ><input type="checkbox" name="symptom" value="burning" /> Burning
          sensation</label
        ><label class="inline"
          ><input type="checkbox" name="symptom" value="fever" /> Fever</label
        ><label class="inline"
          ><input type="checkbox" name="symptom" value="pain" /> Abdominal
          pain</label
        ><label>Preferred Report Format</label
        ><label class="inline"
          ><input type="radio" name="format" value="pdf" checked /> PDF</label
        ><label class="inline"
          ><input type="radio" name="format" value="print" /> Printed
          copy</label
        ><br /><button type="submit">Submit</button
        ><button type="reset">Reset</button>
      </form>
    </main>
    <footer>Somaiya Care Hospital</footer>
  </body>
</html>
