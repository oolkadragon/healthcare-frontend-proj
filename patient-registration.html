<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patient Registration</title>
    <link rel="stylesheet" href="sharedstyle.css" />
  </head>
  <body class="bg-light">
    <header class="bg-success text-white text-center py-4"><h1 class="h2 mb-0">Patient Registration</h1></header>
    <nav class="navbar navbar-dark bg-dark justify-content-center">
      <a href="index.html">Home</a><a href="patient-report.html">Report</a
      ><a href="media.html">Media</a>
    </nav>
    <main class="container py-4"><form class="card shadow-sm mx-auto" style="max-width: 700px" action="#" method="get"><fieldset class="card-body border-0"><legend class="h3">Patient Details</legend>
        <label for="name">Patient Name</label
        ><input class="form-control" id="name" name="name" required /><label for="age">Age</label
        ><input
          id="age"
          name="age"
          type="number"
          min="0"
          max="120"
          class="form-control" required
        /><label for="gender">Gender</label
        ><select class="form-select" id="gender" name="gender">
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
          <option>Prefer not to say</option></select
        ><label for="mobile">Mobile Number</label
        ><input
          id="mobile"
          name="mobile"
          type="tel"
          pattern="[0-9]{10}"
          placeholder="10-digit number"
          class="form-control" required
        /><label for="email">Email</label
        ><input class="form-control" id="email" name="email" type="email" required /><label
          for="patient-id"
          >Patient ID</label
        ><input class="form-control" id="patient-id" name="patient-id" required /><label
          for="test-date"
          >Test Date</label
        ><input class="form-control" id="test-date" name="test-date" type="date" required /><label
          for="doctor"
          >Doctor Name</label
        ><input class="form-control" id="doctor" name="doctor" /><label class="mt-3">Symptoms</label
        ><label class="inline"
          ><input type="checkbox" name="symptom" value="burning" /> Burning
          sensation</label
        ><label class="inline"
          ><input type="checkbox" name="symptom" value="fever" /> Fever</label
        ><label class="inline"
          ><input type="checkbox" name="symptom" value="pain" /> Abdominal
          pain</label
        ><label>Preferred Report Format</label
        ><label class="inline"
          ><input type="radio" name="format" value="pdf" checked /> PDF</label
        ><label class="inline"
          ><input type="radio" name="format" value="print" /> Printed
          copy</label
        ><br /><button class="btn btn-success mt-3" type="submit">Submit</button
        ><button class="btn btn-outline-secondary mt-3" type="reset">Reset</button></fieldset>
      </form>
    </main>
    <footer class="bg-dark text-white text-center py-3">Somaiya Care Hospital</footer>
  </body>
</html>
